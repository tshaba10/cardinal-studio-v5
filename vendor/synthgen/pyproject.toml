[project]
name = "synthgen"
version = "0.1.0"
description = "Deterministic, contract-driven generator of related synthetic data"
requires-python = ">=3.11"
dependencies = ["numpy>=2.1", "pandas>=2.2", "scipy>=1.11"]

[project.scripts]
synthgen = "synthgen.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["synthgen*"]
